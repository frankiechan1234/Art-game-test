<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aetheris: Prism Weaver</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    background: #06070d;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #art { z-index: 1; }
  #fx { z-index: 2; pointer-events: none; }

  #hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    pointer-events: none;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.84);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 6px 10px;
    border-radius: 999px;
    pointer-events: auto;
    font-size: 12px;
    font-weight: 700;
  }
  .group b { color: #38bdf8; }
  .pal-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    touch-action: manipulation;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .pal-dot.active {
    border-color: #ffffff;
    transform: scale(1.2);
  }
  button {
    background: rgba(30, 41, 59, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f8fafc;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.96); }
  button.primary {
    background: #0284c7;
    border-color: #38bdf8;
  }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(6, 7, 13, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .hidden { display: none !important; }
  .card {
    max-width: 430px;
    width: 100%;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    padding: 24px 20px;
    text-align: center;
  }
  h1 { font-size: 25px; color: #38bdf8; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 14px; line-height: 1.45; margin-bottom: 18px; }
  .mode-btn {
    width: 100%;
    display: block;
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 10px;
    background: #1e293b;
  }
  .mode-btn strong { display: block; font-size: 15px; color: #f8fafc; margin-bottom: 2px; }
  .mode-btn span { font-size: 12px; color: #94a3b8; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
</style>
</head>
<body>

<canvas id="art"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hidden">
  <div class="group" id="statsGroup">
    <span>SCORE <b id="sVal">0</b></span>
    <span>•</span>
    <span>COMBO <b id="cVal">1x</b></span>
    <span id="tSep">•</span>
    <span id="tWrap">TIME <b id="tVal">45s</b></span>
  </div>
  <div class="group" id="paletteGroup"></div>
  <div class="group">
    <button id="symBtn">Mirror: OFF</button>
    <button id="clearBtn">Clear</button>
    <button class="primary" id="saveBtn">Save</button>
    <button id="menuBtn">Menu</button>
  </div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="card">
    <h1>Aetheris: Prism Weaver</h1>
    <p>Draw glowing silk ribbons with your finger or mouse, circle orbs to score combos, or switch to pure free-draw.</p>
    <button class="mode-btn" id="btnArcade">
      <strong>Draw + Game (Timed 45s)</strong>
      <span>Draw loops around glowing orbs to capture them, stack combos, and extend your timer.</span>
    </button>
    <button class="mode-btn" id="btnZen">
      <strong>Draw + Zen Orbs (No Timer)</strong>
      <span>Paint freely with mirror symmetry while catching gentle floating orbs at your own pace.</span>
    </button>
    <button class="mode-btn" id="btnDrawOnly">
      <strong>Pure Silk Draw (No Orbs)</strong>
      <span>Blank glowing canvas with mirror mode and instant PNG export.</span>
    </button
