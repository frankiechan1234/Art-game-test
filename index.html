<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aetheris: Prism Weaver</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    background: #06070d; color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #art { z-index: 1; }
  #fx { z-index: 2; pointer-events: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .row { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .pill {
    background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
  }
  .pill b { color: #38bdf8; }
  button {
    background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff; padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  .overlay {
    position: fixed; inset: 0; z-index: 30; background: rgba(6, 7, 13, 0.84);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .hidden { display: none !important; }
  .card {
    max-width: 440px; width: 100%; background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 22px;
    padding: 24px 20px; text-align: center;
  }
  h1 { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 14px; line-height: 1.45; margin-bottom: 18px; }
  .mode-btn {
    width: 100%; display: block; text-align: left; padding: 14px 16px;
    border-radius: 14px; margin-bottom: 10px; background: #1e293b;
  }
  .mode-btn strong { display: block; font-size: 15px; color: #f8fafc; margin-bottom: 2px; }
  .mode-btn span { font-size: 12px; color: #94a3b8; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .primary { background: #0284c7; border-color: #38bdf8; }
</style>
</head>
<body>

<canvas id="art"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hidden">
  <div class="row">
    <div class="pill">SCORE <b id="sVal">0</b></div>
    <div class="pill">COMBO <b id="cVal">1x</b></div>
    <div class="pill" id="tBox">TIME <b id="tVal">45</b></div>
  </div>
  <div class="row">
    <button onclick="openEnd(true)">Pause / Save</button>
  </div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="card">
    <h1>Aetheris: Prism Weaver</h1>
    <p>Drag your finger or mouse to weave glowing ribbons, circle the coins to capture them, and tap to pulse shockwaves.</p>
    <button class="mode-btn" onclick="startGame('arcade')">
      <strong>Lumen Loop (Arcade)</strong>
      <span>Circle VSA Tycoon Coins to capture them and extend the 45s timer.</span>
    </button>
    <button class="mode-btn" onclick="startGame('conduit')">
      <strong>Starlight Conduit (Survival)</strong>
      <span>Collect coins and shatter red Void Spikes with tap shockwaves.</span>
    </button>
    <button class="mode-btn" onclick="startGame('zen')">
      <strong>Zen Canvas (Relax)</strong>
      <span>No timer or spikes. Paint freely with glowing ribbons.</span>
    </button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="card">
    <h1 id="endTitle">Artwork Complete</h1>
    <p id="endStats">Score: 0</p>
    <div class="actions">
      <button class="primary" id="resumeBtn" onclick="resumeGame()">Resume</button>
      <button class="primary" onclick="startGame(mode)">Play Again</button>
      <button onclick="saveArt()">Save PNG</button>
      <button onclick="showMenu()">Menu</button>
    </div>
  </div>
</div>

<script>
const art = document.getElementById('art'), fx = document.getElementById('fx');
const aCtx = art.getContext('2d'), fCtx = fx.getContext('2d');
const COLORS = ['#eab308', '#ca8a04', '#f59e0b', '#d97706', '#facc15']; // Golden tones
const NOTES = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 659.3, 784.0];

// Load Custom Coin Image
const coinImg = new Image();
coinImg.src = 'coin.png'; // Make sure the uploaded file is coin.png

let W = 0, H = 0, mode = 'arcade', state = 'menu';
let score = 0, combo = 1, timer = 45, shields = 3, audioCtx = null;
let ptr = { x: 0, y: 0, px: 0, py: 0, down: false };
let trail = [], orbs = [], spikes = [], waves = [], sparks = [];

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  art.width = fx.width = W; art.height = fx.height = H;
  aCtx.fillStyle = '#06070d'; aCtx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

function beep(freq, dur = 0.2) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function randCol() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80), y: 70 + Math.random() * (H - 110),
    vx: (Math.random() - 0.5) * 50, vy: (Math.random() - 0.5) * 50,
    r: 18, col: randCol()
  });
}

function spawnSpike() {
  const edge = Math.floor(Math.random() * 4);
  const x = edge === 1 ? W + 15 : edge === 3 ? -15 : Math.random() * W;
  const y = edge === 0 ? -15 : edge === 2 ? H + 15 : Math.random() * H;
  const ang = Math.atan2(H / 2 - y, W / 2 - x);
  spikes.push({ x, y, vx: Math.cos(ang) * 95, vy: Math.sin(ang) * 95, r: 14 });
}

function updateHUD() {
  document.getElementById('sVal').textContent = score;
  document.getElementById('cVal').textContent = combo + 'x';
  const tBox = document.getElementById('tBox');
  if (mode === 'arcade') { tBox.style.display = 'block'; document.getElementById('tVal').textContent = Math.ceil(timer) + 's'; }
  else if (mode === 'conduit') { tBox.style.display = 'block'; document.getElementById('tVal').textContent = '♥'.repeat(Math.max(0, shields)); }
  else { tBox.style.display = 'none'; }
}

function startGame(m) {
  mode = m; state = 'playing'; score = 0; combo = 1; timer = 45; shields = 3;
  trail = []; orbs = []; spikes = []; waves = []; sparks = [];
  aCtx.globalCompositeOperation = 'source-over';
  aCtx.fillStyle = '#06070d'; aCtx.fillRect(0, 0, W, H);
  for (let i = 0; i < 6; i++) spawnOrb();
  document.getElementById('menuOverlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  updateHUD();
  beep(523.3, 0.25);
}

function openEnd(paused) {
  state = paused ? 'paused' : 'gameover';
  document.getElementById('endTitle').textContent = paused ? 'Studio Paused' : 'Tapestry Complete';
  document.getElementById('endStats').textContent = `Final Score: ${score}  •  Max Combo: ${combo}x`;
  document.getElementById('resumeBtn').style.display = paused ? 'inline-block' : 'none';
  document.getElementById('endOverlay').classList.remove('hidden');
}

function resumeGame() {
  state = 'playing';
  document.getElementById('endOverlay').classList.add('hidden');
}

function showMenu() {
  state = 'menu';
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('menuOverlay').classList.remove('hidden');
}

function saveArt() {
  const a = document.createElement('a');
  a.download = 'prism-weaver.png';
  a.href = art.toDataURL('image/png');
  a.click();
}

function burst(x, y, col) {
  aCtx.save();
  aCtx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 18; i++) {
    const ang = Math.random() * Math.PI * 2, d = Math.random() * 45;
    aCtx.fillStyle = col; aCtx.globalAlpha = 0.35;
    aCtx.beginPath(); aCtx.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d, 2 + Math.random() * 5, 0, Math.PI * 2); aCtx.fill();
    sparks.push({ x, y, vx: Math.cos(ang) * 140, vy: Math.sin(ang) * 140, col, life: 0.6 });
  }
  aCtx.restore();
}

function pulseWave(x, y) {
  if (state !== 'playing') return;
  const col = randCol();
  waves.push({ x, y, r: 10, col });
  beep(196, 0.25);
}

function moveInput(x, y) {
  if (state !== 'playing') return;
  if (!ptr.down) { ptr.px = x; ptr.py = y; ptr.down = true; }
  const dist = Math.hypot(x - ptr.px, y - ptr.py);
  if (dist > 2) {
    const col = COLORS[Math.floor((performance.now() * 0.004) % COLORS.length)];
    trail.push({ x, y, col });
    if (trail.length > 45) trail.shift();

    aCtx.save();
    aCtx.globalCompositeOperation = 'lighter';
    aCtx.strokeStyle = col; aCtx.globalAlpha = 0.35; aCtx.lineWidth = 4; aCtx.lineCap = 'round';
    aCtx.beginPath(); aCtx.moveTo(ptr.px, ptr.py); aCtx.lineTo(x, y); aCtx.stroke();
    aCtx.restore();

    if (trail.length > 14) {
      for (let i = 0; i < trail.length - 12; i++) {
        if (Math.hypot(x - trail[i].x, y - trail[i].y) < 36) {
          const cx = (x + trail[Math.floor((i + trail.length) / 2)].x) / 2;
          const cy = (y + trail[Math.floor((i + trail.length) / 2)].y) / 2;
          orbs.forEach((o, idx) => {
            if (Math.hypot(o.x - cx, o.y - cy) < 120) {
              burst(o.x, o.y, o.col);
              score += 100 * combo; combo = Math.min(combo + 1, 20);
              if (mode === 'arcade') timer = Math.min(timer + 2, 60);
              beep(NOTES[combo % NOTES.length]);
              orbs.splice(idx, 1); spawnOrb(); updateHUD();
            }
          });
          trail = []; break;
        }
      }
    }
  }
  ptr.px = x; ptr.py = y; ptr.x = x; ptr.y = y;
}

art.addEventListener('mousemove', e => moveInput(e.clientX, e.clientY));
art.addEventListener('mousedown', e => { ptr.down = false; moveInput(e.clientX, e.clientY); pulseWave(e.clientX, e.clientY); });

art.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  ptr.down = false; trail = [];
  moveInput(t.clientX, t.clientY);
  pulseWave(t.clientX, t.clientY);
}, { passive: false });

art.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  moveInput(t.clientX, t.clientY);
}, { passive: false });

art.addEventListener('touchend', e => { e.preventDefault(); ptr.down = false; }, { passive: false });

let last = performance.now(), spTimer = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  fCtx.clearRect(0, 0, W, H);

  if (state === 'playing') {
    if (mode === 'arcade') {
      timer -= dt;
      if (timer <= 0) { timer = 0; updateHUD(); openEnd(false); }
      else updateHUD();
    }
    if (mode === 'conduit') {
      spTimer -= dt;
      if (spTimer <= 0) { spawnSpike(); spTimer = 1.6; }
    }

    orbs.forEach(o => {
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.x < 30 || o.x > W - 30) o.vx *= -1;
      if (o.y < 60 || o.y > H - 30) o.vy *= -1;
      if (ptr.down && Math.hypot(ptr.x - o.x, ptr.y - o.y) < o.r + 18) {
        burst(o.x, o.y, o.col);
        score += 30 * combo;
        beep(NOTES[score % NOTES.length], 0.15);
        o.x = 40 + Math.random() * (W - 80); o.y = 70 + Math.random() * (H - 110); o.col = randCol();
        updateHUD();
      }
      
      // Draw Custom coin Image!
      if (coinImg.complete) {
        fCtx.save();
        // Add subtle shadow behind the coin
        fCtx.shadowBlur = 10;
        fCtx.shadowColor = o.col;
        fCtx.drawImage(coinImg, o.x - o.r, o.y - o.r, o.r*2, o.r*2);
        fCtx.restore();
      } else {
        // Fallback to gold dots if coin hasn't loaded yet
        fCtx.fillStyle = '#fbbf24'; fCtx.beginPath(); fCtx.arc(o.x, o.y, o.r, 0, Math.PI * 2); fCtx.fill();
        fCtx.fillStyle = '#fff'; fCtx.beginPath(); fCtx.arc(o.x, o.y, 5, 0, Math.PI * 2); fCtx.fill();
      }
    });

    for (let i = spikes.length - 1; i >= 0; i--) {
      const s = spikes[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (waves.some(w => Math.hypot(s.x - w.x, s.y - w.y) < w.r + s.r)) {
        burst(s.x, s.y, '#f472b6'); score += 75 * combo; spikes.splice(i, 1); updateHUD(); continue;
      }
      if (ptr.down && Math.hypot(s.x - ptr.x, s.y - ptr.y) < s.r + 12) {
        shields--; combo = 1; burst(ptr.x, ptr.y, '#ef4444'); spikes.splice(i, 1); updateHUD();
        if (shields <= 0) openEnd(false);
        continue;
      }
      fCtx.fillStyle = '#ef4444'; fCtx.beginPath(); fCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2); fCtx.fill();
    }
  }

  for (let i = 1; i < trail.length; i++) {
    fCtx.strokeStyle = trail[i].col; fCtx.lineWidth = (i / trail.length) * 6; fCtx.lineCap = 'round';
    fCtx.beginPath(); fCtx.moveTo(trail[i - 1].x, trail[i - 1].y); fCtx.lineTo(trail[i].x, trail[i].y); fCtx.stroke();
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i]; w.r += 380 * dt;
    if (w.r > 150) { waves.splice(i, 1); continue; }
    fCtx.strokeStyle = w.col; fCtx.lineWidth = 3; fCtx.beginPath(); fCtx.arc(w.x, w.y, w.r, 0, Math.PI * 2); fCtx.stroke();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    fCtx.fillStyle = p.col; fCtx.beginPath(); fCtx.arc(p.x, p.y, 3, 0, Math.PI * 2); fCtx.fill();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
